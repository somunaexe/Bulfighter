# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/super-linter/super-linter
name: Lint Code Base

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions: {}

jobs:
  run-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # The flat eslint.config.js imports project devDependencies (e.g.
      # eslint-plugin-react-refresh) by name - super-linter's own ESLint
      # runtime can only resolve those if node_modules actually exists in
      # the checked-out workspace it shares with this step.
      - name: Install dependencies (for ESLint plugin resolution)
        run: npm ci

      - name: Lint Code Base
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: 'main'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The repo's ESLint config is a flat config at the repository root
          # (eslint.config.js), not super-linter's default lookup location
          # (.github/linters/eslint.config.mjs) - point it at the real one
          # instead of letting it fall back to a broken/mismatched config.
          LINTER_RULES_PATH: '.'
          JAVASCRIPT_ES_CONFIG_FILE: 'eslint.config.js'
