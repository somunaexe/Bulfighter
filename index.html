<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="assets/bulfighter-logo1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bulfighter</title>
    <meta
      name="description"
      content="Just a bunch of noisemakers. Watch our latest videos reacting to food order histories, Spotify Wrapped, and hot takes."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bulfighter" />
    <meta property="og:title" content="Bulfighter" />
    <meta
      property="og:description"
      content="Just a bunch of noisemakers. Watch our latest videos reacting to food order histories, Spotify Wrapped, and hot takes."
    />
    <meta property="og:url" content="https://bulfighter.com" />
    <meta
      property="og:image"
      content="https://bulfighter.com/assets/og-image.png"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bulfighter" />
    <meta
      name="twitter:description"
      content="Just a bunch of noisemakers. Watch our latest videos reacting to food order histories, Spotify Wrapped, and hot takes."
    />
    <meta
      name="twitter:image"
      content="https://bulfighter.com/assets/og-image.png"
    />
    <script>
      (() => {
        var stored = localStorage.getItem('ram_theme');
        var theme = stored === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        // Runs before React mounts, same as the data-theme line above, so the
        // tab icon matches the theme from the very first paint instead of
        // flashing the light-mode one first. useTheme.js keeps this in sync
        // afterward whenever the user actually toggles the theme.
        document.querySelector('link[rel="icon"]').href =
          theme === 'dark'
            ? 'assets/bulfighter-logo1-dark.png'
            : 'assets/bulfighter-logo1.png';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
